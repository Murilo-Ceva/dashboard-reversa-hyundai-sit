.pendtable th{cursor:pointer}.pendtable td{max-width:300px;overflow:hidden;text-overflow:ellipsis}.pendtable tbody tr{cursor:pointer}.muted{color:var(--muted)}
.found{border-left:4px solid #0e9384;background:rgba(14,147,132,.1);padding:8px 10px;border-radius:8px;font-size:12px}
.rule.hit{outline:2px solid var(--blue)}.jband{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.jband span{border:1px solid var(--line);border-radius:8px;padding:6px;font-size:10px}.jband span.on{color:#fff;border-color:transparent}.jband b{display:block;font-size:11px}
.nf-search .action{white-space:nowrap}
@media(max-width:900px){.gbody{flex-direction:column}.jband{grid-template-columns:repeat(2,1fr)}}
/* v4.1 */
.fmatrix table{table-layout:fixed;width:100%;font-size:10px}.fmatrix th,.fmatrix td{padding:5px 6px;white-space:normal;position:static}.fmatrix th:nth-child(1),.fmatrix td:nth-child(1){width:4%}.fmatrix th:nth-child(2){width:17%}.fmatrix th:nth-child(3){width:12%}.fmatrix td.fc{min-width:0}.fmatrix td.etp{min-width:0;font-size:11px}.fmatrix td.sla{font-size:9px;min-width:0}
.fcnt{border:0;background:transparent;color:var(--text);font-weight:900;font-size:18px;cursor:pointer;padding:0 8px;border-radius:8px;text-decoration:underline dotted}.fcnt:hover{background:rgba(7,88,183,.18)}
.pendtable td .fpill{padding:4px 14px;font-size:12px}.pendtable td b{font-weight:800}
/* v4.2 */
.devtag{display:inline-block;padding:1px 8px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:10px;font-weight:800}body.dark .devtag{background:#4a3a0f;color:#fcd34d}
.insights{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:10px}.insight[data-filter]{cursor:pointer}.insight[data-filter]:hover{filter:brightness(.97)}
.pvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pvgrid>span{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}.pvgrid small{color:var(--muted);font-size:10px}.pvgrid b{font-size:14px}
.grpbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px;font-size:12px}.grpbar .chip{cursor:pointer;opacity:.65}.grpbar .chip.on{opacity:1}
.pendtable th.stk,.pendtable td.stk{position:sticky;z-index:2;min-width:92px;max-width:92px}.pendtable th.stk0,.pendtable td.stk0{left:0}.pendtable th.stk1,.pendtable td.stk1{left:92px}.pendtable td.stk{background:var(--panel)}.pendtable th.stk{z-index:3}
.nf-search select{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel);color:var(--text)}
.ttable tbody tr:hover{background:rgba(7,88,183,.08)}
@media(max-width:900px){.pvgrid{grid-template-columns:1fr}}
.pendtable th.stk1,.pendtable td.stk1{left:92px;min-width:130px;max-width:130px}

/* v4.3: escala equivalente a 90% de zoom do navegador em telas de notebook */
@media (min-width:1000px){
html body{zoom:.9!important}
.app{min-height:calc(100vh/.9)!important}
.sidebar{height:calc(100vh/.9)!important}
.main{width:calc(100vw/.9 - var(--sidebar-w))!important}
.cards{grid-template-columns:repeat(7,minmax(0,1fr))!important}
}

const norm=v=>String(v??'').trim(); const upper=v=>norm(v).toUpperCase(); const valid=v=>v!==null&&v!==undefined&&norm(v)!==''&&norm(v)!=='-';
function parseDate(v){if(!valid(v))return null;let d=new Date(v+'T00:00:00');return isNaN(d)?null:d}function fmtDate(v){let d=parseDate(v);return d?d.toLocaleDateString('pt-BR'):norm(v)}
function enrich(r){let d=parseDate(r['Prev. Coleta']);r.__year=d?String(d.getFullYear()):'Sem data';r.__month=d?String(d.getMonth()+1).padStart(2,'0')+' - '+d.toLocaleString('pt-BR',{month:'long'}):'Sem data';let sf=upper(r['Status Final']);r.__stage=sf.includes('COLETA')?'Pendente coleta':sf.includes('XD')?'Pendente envio ao XD':sf.includes('CLIENTE')?'Pendente entrega final':sf==='ENTREGUE'?'Entregue':sf||'Não classificado';let ar=norm(r['Aging Reversa']);r.__aging=ar||'Não classificado';r.__hasNFD=valid(r.NFD)?'Com NFD':'Sem NFD';r.__hasCTE=valid(r['CT-e'])?'Com CT-e':'Sem CT-e';r.__hasXD=valid(r['Chegada Diadema'])?'Com chegada XD':'Sem chegada XD';r.__hasFinal=valid(r['Chegada Hyundai'])?'Com chegada Hyundai':'Sem chegada Hyundai';return r} data.forEach(enrich);

function buildFilters(){filters.innerHTML='';filterDefs.forEach(([lab,key,prot])=>{if(prot&&!full)return;let box=document.createElement('div');box.className='filter';let btn=document.createElement('button');btn.textContent=lab+' ▾';let drop=document.createElement('div');drop.className='drop';let sr=document.createElement('input');sr.type='search';sr.placeholder='Buscar...';drop.appendChild(sr);let holder=document.createElement('div');drop.appendChild(holder);function opts(){let counts={};data.forEach(r=>{let v=norm(r[key]);if(!v)return;counts[v]=(counts[v]||0)+1});let q=upper(sr.value);holder.innerHTML='';Object.entries(counts).filter(([v])=>upper(v).includes(q)).sort((a,b)=>b[1]-a[1]).forEach(([v,c])=>{let l=document.createElement('label');l.className='opt';let ck=document.createElement('input');ck.type='checkbox';ck.checked=(selections[key]||new Set()).has(v);ck.onchange=()=>{selections[key]??=new Set();ck.checked?selections[key].add(v):selections[key].delete(v);apply()};l.append(ck,document.createTextNode(v));let sp=document.createElement('span');sp.className='count';sp.textContent=c;l.appendChild(sp);holder.appendChild(l)})}sr.oninput=opts;opts();btn.onclick=e=>{e.stopPropagation();document.querySelectorAll('.filter').forEach(x=>x!==box&&x.classList.remove('open'));box.classList.toggle('open')};box.append(btn,drop);filters.appendChild(box)})}

function apply(){filtered=data.filter(r=>{for(let [k,s] of Object.entries(selections)){if(s.size&&!s.has(norm(r[k])||'Sem informação'))return false}if(search){let vals=Object.entries(r).filter(([k])=>full||!protectedCols.includes(k)).map(x=>norm(x[1])).join(' ');if(!upper(vals).includes(upper(search)))return false}return true});page=1;renderAll(false)}
function clickFilter(key,val,evt){if(!evt?.ctrlKey)selections[key]=new Set();selections[key]??=new Set();selections[key].has(val)?selections[key].delete(val):selections[key].add(val);apply()}
function metric(col){let arr=filtered.filter(r=>['REALIZADO NO PRAZO','REALIZADO FORA DO PRAZO'].includes(upper(r[col])));let ok=arr.filter(r=>upper(r[col])==='REALIZADO NO PRAZO').length;return {ok,total:arr.length,pct:arr.length?ok/arr.length*100:null}}
function monthRows(offset=0){let now=new Date(),y=now.getFullYear(),m=now.getMonth()+offset;let d=new Date(y,m,1),yy=String(d.getFullYear()),mm=String(d.getMonth()+1).padStart(2,'0');return data.filter(r=>r.__year===yy&&String(r.__month||'').startsWith(mm+' -'))}
function gaugeMoM(title,col){let html=gauge(title,col),cur=metricFrom(filtered,col),prev=metricFrom(monthRows(-1),col),txt=(cur.pct==null||prev.pct==null)?'Comparativo mensal indisponível':`${cur.pct>=prev.pct?'▲':'▼'} ${Math.abs(cur.pct-prev.pct).toFixed(1).replace('.',',')} p.p. vs. mês anterior`;return html.replace('</div><div class="gauge-meta">',`</div><div class="mom ${cur.pct>=prev.pct?'up':'down'}">${txt}</div><div class="gauge-meta">`)}

/* Carregamento automatico da planilha hospedada ao lado do index.html no GitHub Pages.
   A planilha continua fora do HTML. O parametro de versao evita dados antigos em cache. */
async function autoLoadRepoData(){
  const repoFileName='Controle Reversa - Hyundai .xlsb';
  const statusOriginal=importBtn.textContent;
  try{
    window.__autoLoading=true;
    importBtn.textContent='⏳ Carregando base...';
    const url='./'+encodeURIComponent(repoFileName).replace(/%2F/g,'/')+'?v='+Date.now();
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status} ao carregar ${repoFileName}`);
    const blob=await response.blob();
    const modified=response.headers.get('last-modified');
    const file=new File([blob],repoFileName,{
      type:'application/vnd.ms-excel.sheet.binary.macroEnabled.12',
      lastModified:modified?new Date(modified).getTime():Date.now()
    });
    await fileInput.onchange({target:{files:[file]}});
  }catch(err){
    console.error('Falha no carregamento automatico da base:',err);
    importBtn.textContent=statusOriginal;
    alert('O painel abriu, mas não conseguiu carregar automaticamente a base do repositório.\n\n'+
          'Verifique se o arquivo está na mesma pasta do index.html e mantém exatamente este nome:\n'+
          repoFileName+'\n\nDetalhe: '+err.message);
  }finally{
    window.__autoLoading=false;
  }
}
autoLoadRepoData();
